<svg xmlns="http://www.w3.org/2000/svg" viewBox="150 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Solid Background -->
    <rect id="bg" width="800" height="500" fill="#FFFFFF" />
  </defs>


  <!-- CONNECTIONS (Horizontal and Vertical Grid Lines) -->
  <g stroke="#000000" stroke-width="25" fill="none" stroke-linecap="round">
    <!-- Horizontal Connections -->
    <path d="M 200 90 L 600 90" />
    <path d="M 200 250 L 600 250" />
    <path d="M 200 410 L 600 410" />

    <!-- Vertical Connections -->
    <path d="M 200 90 L 200 410" />
    <path d="M 400 90 L 400 410" />
    <path d="M 600 90 L 600 410" />
  </g>

  <!-- NODES -->

  <!-- ROW 1 -->
  <g transform="translate(200, 90)">
    <circle r="24" fill="#FFFFFF" stroke="#000000" stroke-width="20" />
  </g>
  <g transform="translate(400, 90)">
    <circle r="24" fill="#FFFFFF" stroke="#000000" stroke-width="20" />
  </g>
  <g transform="translate(600, 90)">
    <circle r="24" fill="#FFFFFF" stroke="#000000" stroke-width="20" />
  </g>

  <!-- ROW 2 -->
  <g transform="translate(200, 250)">
    <circle r="24" fill="#FFFFFF" stroke="#000000" stroke-width="20" />
  </g>
  <g transform="translate(400, 250)">
    <circle r="24" fill="#FFFFFF" stroke="#000000" stroke-width="20" />
  </g>
  <g transform="translate(600, 250)">
    <circle r="24" fill="#FFFFFF" stroke="#000000" stroke-width="20" />
  </g>

  <!-- ROW 3 -->
  <g transform="translate(200, 410)">
    <circle r="24" fill="#FFFFFF" stroke="#000000" stroke-width="20" />
  </g>
  <g transform="translate(400, 410)">
    <circle r="24" fill="#FFFFFF" stroke="#000000" stroke-width="20" />
  </g>
  <g transform="translate(600, 410)">
    <circle r="24" fill="#FFFFFF" stroke="#000000" stroke-width="20" />
  </g>
</svg>